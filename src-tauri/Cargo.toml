[package]
name = "ocean"
version = "0.1.0"
description = "AI-native cross-platform video editor"
authors = ["Ocean"]
edition = "2021"

[lib]
name = "ocean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
ab_glyph = "0.2"
base64 = "0.22"

# Optimize dependencies (image codecs, png, resize) even in dev builds so frame
# rendering is fast while our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "render_sample"
path = "examples/render_sample.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
